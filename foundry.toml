[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Avalanche C-Chain fork
[rpc_endpoints]
avalanche = "${AVALANCHE_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[etherscan]
avalanche = { key = "${SNOWTRACE_API_KEY}", url = "https://api.snowtrace.io/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
